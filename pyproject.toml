[project]
name = "nobleblocks-mcp"
version = "0.1.0"
description = "MCP server exposing NobleBlocks paper search to Claude Desktop, ChatGPT, and other AI tools"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
nobleblocks-mcp = "nobleblocks_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nobleblocks_mcp"]
