[project]
name = "nobleblocks-mcp"
version = "2.0.9"
description = "Connect your AI assistant to 340M+ academic papers and a biomedical knowledge graph. Search, explore citations, find related work, and generate literature reviews — powered by NobleBlocks."
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "NobleBlocks", email = "info@nobleblocks.com"}]
keywords = ["mcp", "nobleblocks", "research", "papers", "academic", "search", "knowledge-graph", "vector-search", "pubmed", "arxiv"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Indexing",
]
readme = "README.md"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.30.0",
    "starlette>=0.37.0",
    "boto3>=1.34.0",
]

[project.urls]
Homepage = "https://www.nobleblocks.com"
Repository = "https://github.com/nobleblocks/nobleblocks-mcp"
Documentation = "https://www.nobleblocks.com/docs/mcp"

[project.scripts]
nobleblocks-mcp = "nobleblocks_mcp.server:main"
nobleblocks-mcp-remote = "nobleblocks_mcp.remote_server:main"
nobleblocks = "nobleblocks_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nobleblocks_mcp"]
